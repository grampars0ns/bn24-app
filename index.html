  --hair:1px solid var(--line);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131014;
    --card:#1D181B;
    --card2:#231D20;
    --ink:#F2EDEB;
    --muted:#A29498;
    --line:#2E272B;
    --line2:#272125;
    --red:#E83B52;
    --red-deep:#F06277;
    --red-tint:rgba(232,59,82,.12);
    --gold:#D9B44A;
    --gold-bright:#D9B44A;
    --gold-tint:rgba(217,180,74,.12);
    --up:#5CB884;
    --down:#E83B52;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --nav-bg:rgba(24,20,22,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#131014;--card:#1D181B;--card2:#231D20;--ink:#F2EDEB;--muted:#A29498;
  --line:#2E272B;--line2:#272125;--red:#E83B52;--red-deep:#F06277;--red-tint:rgba(232,59,82,.12);
  --gold:#D9B44A;--gold-bright:#D9B44A;--gold-tint:rgba(217,180,74,.12);
  --up:#5CB884;--down:#E83B52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--nav-bg:rgba(24,20,22,.94);
}
:root[data-theme="light"]{
  --bg:#F3F1EE;--card:#FFFFFF;--card2:#FAF8F6;--ink:#1C1517;--muted:#786A6E;
  --line:#E5DFDA;--line2:#EFEAE5;--red:#C8102E;--red-deep:#A50D24;--red-tint:rgba(200,16,46,.08);
  --gold:#96731A;--gold-bright:#C9A227;--gold-tint:rgba(201,162,39,.14);
  --up:#2F7D4F;--down:#C8102E;
  --shadow:0 1px 2px rgba(28,21,23,.05),0 8px 24px rgba(28,21,23,.06);--nav-bg:rgba(255,255,255,.94);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  border-left:var(--hair);border-right:var(--hair);background:var(--bg);}
@media(max-width:540px){.shell{border:none}}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:is(a,button):focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.disp{font-family:'Oswald',Impact,'Arial Narrow',sans-serif}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--nav-bg);backdrop-filter:blur(12px);
  border-bottom:var(--hair);
}
.masthead{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.wordmark{font-family:'Oswald',Impact,sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;
  text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:1px}
.wordmark .n{color:var(--red)}
.wordmark .badge{background:var(--red);color:#fff;font-size:15px;padding:2px 5px 1px;margin-left:4px;
  border-radius:2px;transform:translateY(-1px)}
.updated{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.04em}
.viewbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.viewtitle{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted)}
.viewtitle b{color:var(--ink);font-weight:600}

/* ---------- main ---------- */
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.view{display:none;flex-direction:column;gap:14px;animation:rise .22s ease}
.view.on{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .view{animation:none}.sheet,.sheet-bg{transition:none!important}
}

/* ---------- feed ---------- */
.hero{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  display:block;text-decoration:none;background:var(--card)}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.hero .scrim{position:absolute;inset:0;background:var(--scrim)}
.hero .body{position:absolute;left:0;right:0;bottom:0;padding:16px;color:#fff}
.hero h2{font-family:'Oswald',Impact,sans-serif;font-weight:600;text-transform:uppercase;
  font-size:24px;line-height:1.12;margin:8px 0 6px;letter-spacing:.01em;text-wrap:balance}
.hero .meta{font-size:12px;color:rgba(255,255,255,.75)}
.chip{display:inline-block;font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:3px;line-height:1.4}
.chip.red{background:var(--red);color:#fff}
.chip.gold{background:var(--gold-tint);color:var(--gold)}
.chip.ghost{border:1px solid var(--line);color:var(--muted);background:var(--card)}
.chip.tint{background:var(--red-tint);color:var(--red-deep)}

.card-list{display:flex;flex-direction:column;gap:10px}
.story{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:12px;
  box-shadow:var(--shadow);text-decoration:none;align-items:flex-start}
.story .thumb{width:92px;height:92px;border-radius:8px;object-fit:cover;flex:none;background:var(--card2)}
.story h3{margin:3px 0 4px;font-size:14.5px;line-height:1.32;font-weight:650;letter-spacing:-.01em}
.story .meta{font-size:11.5px;color:var(--muted)}
.story .excerpt{font-size:12.5px;color:var(--muted);margin:4px 0 0;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.section-h{display:flex;align-items:center;gap:10px;margin:6px 0 -2px}
.section-h .t{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase}
.section-h .rule{flex:1;height:1px;background:var(--line)}
.section-h .mark{width:4px;height:14px;background:var(--red);border-radius:1px}

/* ---------- results ---------- */
.res-row{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;background:var(--card);
  border-radius:12px;box-shadow:var(--shadow);text-decoration:none}
.res-row .m{flex:none;width:58px;text-align:center;font-family:'Oswald',Impact,sans-serif;
  font-weight:600;font-size:11px;letter-spacing:.08em;padding:4px 0;border-radius:4px;margin-top:1px}
.m.ko{background:var(--red);color:#fff}
.m.dec{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.m.draw{background:var(--gold-tint);color:var(--gold)}
.m.card{border:1px dashed var(--line);color:var(--muted)}
.res-row h3{margin:0 0 3px;font-size:14px;line-height:1.35;font-weight:600}
.res-row .d{font-size:11.5px;color:var(--muted)}

/* ---------- schedule ---------- */
.event{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.event .top{display:flex;gap:14px;padding:14px 14px 12px;align-items:center}
.datebox{flex:none;width:56px;text-align:center;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:7px 0 8px;font-family:'Oswald',Impact,sans-serif;line-height:1}
.datebox .mo{font-size:10px;letter-spacing:.24em;font-weight:600;opacity:.7;display:block;margin-bottom:3px;padding-left:.24em}
.datebox .dy{font-size:24px;font-weight:600}
.event .where{min-width:0}
.event .place{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:17px;
  text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.event .times{font-size:11.5px;color:var(--muted);margin-top:3px}
.event .tv{margin-left:auto;flex:none;align-self:flex-start}
.bouts{border-top:var(--hair);padding:4px 14px 10px}
.bout{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.bout:last-child{border-bottom:none}
.bout .txt{font-size:13.5px;line-height:1.4;min-width:0}
.bout.main .txt{font-weight:650;font-size:14.5px}
.bout .belt{flex:none}

/* ---------- rankings ---------- */
.seg{display:flex;background:var(--card2);border:var(--hair);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 0;border-radius:7px;font-family:'Oswald',Impact,sans-serif;
  font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.divs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.divs::-webkit-scrollbar{display:none}
.divs button{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-family:'Oswald',Impact,sans-serif;font-weight:500;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.divs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.champ-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;
  background:linear-gradient(120deg,var(--gold-tint),transparent 75%);border:1px solid var(--gold-tint)}
.champ-row .belt-ic{flex:none}
.champ-row .lbl{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.champ-row .nm{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.champ-row .lim{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;flex:none}
.rank-list{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.rk{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.rk:last-child{border-bottom:none}
.rk .pos{flex:none;width:26px;font-family:'Oswald',Impact,sans-serif;font-weight:600;
  font-size:17px;color:var(--muted);text-align:center}
.rk:nth-child(1) .pos{color:var(--red)}
.rk .who{min-width:0}
.rk .nm{font-weight:650;font-size:14px;line-height:1.25}
.rk .sub{font-size:11.5px;color:var(--muted)}
.rk .right{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
.rk .rec{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mv{flex:none;width:26px;text-align:center;font-size:11px;font-weight:700}
.mv.up{color:var(--up)}.mv.dn{color:var(--down)}.mv.same{color:var(--muted);opacity:.5}
.p4p-note{font-size:12.5px;color:var(--muted);line-height:1.55;padding:0 2px}

/* ---------- bottom nav ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:40;
  background:var(--nav-bg);backdrop-filter:blur(14px);border-top:var(--hair);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;
  color:var(--muted);border-radius:8px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button .lb{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase}
nav button.on{color:var(--red)}

/* ---------- more sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(15,10,12,.45);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:520px;
  z-index:51;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  transition:transform .26s cubic-bezier(.3,.9,.3,1);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h4{font-family:'Oswald',Impact,sans-serif;font-weight:600;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sheet a{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line2);
  text-decoration:none;font-weight:550;font-size:14.5px}
.sheet a:last-of-type{border-bottom:none}
.sheet a .arr{margin-left:auto;color:var(--muted);font-size:13px}
.sheet .foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5}
</style>
</head>

const beltSVG = (c, s=18) => `<svg class="belt" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="title fight" role="img"><circle cx="12" cy="12" r="5.2"/><path d="M8.2 8.6 3.5 6.5v7l4.7-1.2M15.8 8.6l4.7-2.1v7l-4.7-1.2"/><circle cx="12" cy="12" r="1.6"/></svg>`;

/* ---------- FEED ---------- */
function renderFeed(){
  const [hero, ...rest] = DATA.feed;
  let h = `<a class="hero" href="${esc(hero.link)}" target="_blank" rel="noopener">
    <img src="${hero.img64}" alt="">
    <div class="scrim"></div>
    <div class="body">
      <span class="chip red">${esc(hero.tag)}</span>
      <h2>${esc(hero.title)}</h2>
      <div class="meta">${esc(hero.author)} · ${esc(hero.dateLabel)} · ${esc(hero.timeLabel)}</div>
    </div></a>
    <div class="section-h"><span class="mark"></span><span class="t disp">Latest</span><span class="rule"></span></div>
    <div class="card-list">`;
  for(const it of rest){
    h += `<a class="story" href="${esc(it.link)}" target="_blank" rel="noopener">
      ${it.img64 ? `<img class="thumb" src="${it.img64}" alt="" loading="lazy">` : ''}
      <div><span class="chip tint">${esc(it.tag)}</span>
        <h3>${esc(it.title)}</h3>
        <div class="meta">${esc(it.author)} · ${esc(it.dateLabel)}</div>
      </div></a>`;
  }
  $('#v-feed').innerHTML = h + `</div>`;
}

/* ---------- RESULTS ---------- */
function renderResults(){
  const cls = {'KO/TKO':'ko','DEC':'dec','DRAW':'draw','CARD':'card'};
  let h = `<div class="section-h"><span class="mark"></span><span class="t disp">Recent Results</span><span class="rule"></span></div>
  <div class="card-list">`;
  for(const r of DATA.results){
    h += `<a class="res-row" href="${esc(r.link)}" target="_blank" rel="noopener">
      <span class="m ${cls[r.method]||'dec'}">${r.method==='CARD'?'LIVE':esc(r.method)}</span>
      <div><h3>${esc(r.title)}</h3><div class="d num">${esc(r.dateLabel)}, 2026</div></div></a>`;
  }
  $('#v-results').innerHTML = h + `</div>`;
}

/* ---------- SCHEDULE ---------- */
function renderSchedule(){
  let h = '';
  for(const ev of DATA.schedule){
    const hasTitle = ev.bouts.some(b => b.title);
    h += `<div class="event">
      <div class="top">
        <div class="datebox"><span class="mo">${esc(ev.mon)}</span><span class="dy num">${ev.day}</span></div>
        <div class="where">
          <div class="place">${esc(ev.place)}</div>
          <div class="times num">${ev.et ? esc(ev.et)+' ET' : ''}${ev.et && ev.uk ? ' · ' : ''}${ev.uk ? esc(ev.uk)+' UK' : ''}</div>
        </div>
        <div class="tv">${ev.tv ? `<span class="chip ghost">${esc(ev.tv)}</span>` : (hasTitle ? `<span class="chip gold">Title Card</span>` : '')}</div>
      </div>
      <div class="bouts">`;
    ev.bouts.forEach((b, i) => {
      h += `<div class="bout${i===0 ? ' main' : ''}">
        ${b.title ? beltSVG('var(--gold)') : `<span class="belt" style="width:18px"></span>`}
        <span class="txt">${esc(b.text)}</span></div>`;
    });
    h += `</div></div>`;
  }
  $('#v-schedule').innerHTML = h;
}

/* ---------- RANKINGS ---------- */
let rkMode = 'p4p', rkDiv = 0;
function moveHTML(f){
  if(f.new) return `<span class="mv up">NEW</span>`;
  if(f.move > 0) return `<span class="mv up">▲${f.move}</span>`;
  if(f.move < 0) return `<span class="mv dn">▼${-f.move}</span>`;
  return `<span class="mv same">—</span>`;
}
function renderRankings(){
  let h = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${rkMode==='p4p'}" class="${rkMode==='p4p'?'on':''}" onclick="setRk('p4p')">Pound for Pound</button>
    <button role="tab" aria-selected="${rkMode==='div'}" class="${rkMode==='div'?'on':''}" onclick="setRk('div')">By Division</button>
  </div>`;
  if(rkMode === 'p4p'){
    h += `<p class="p4p-note">${esc(DATA.rankings.intro)}</p><div class="rank-list">`;
    DATA.rankings.p4p.forEach((f, i) => {
      h += `<div class="rk">
        <span class="pos num">${i+1}</span>
        <div class="who"><div class="nm">${esc(f.name)} ${f.champ ? beltSVG('var(--gold)',14) : ''}</div>
        <div class="sub">${esc(f.div)} · ${esc(f.cty)}</div></div>
        <div class="right"><span class="rec num">${esc(f.rec)}</span></div></div>`;
    });
    h += `</div>`;
  } else {
    h += `<div class="divs">`;
    DATA.rankings.divisions.forEach((d, i) => {
      h += `<button class="${i===rkDiv?'on':''}" onclick="setDiv(${i})">${esc(d.name)}</button>`;
    });
    h += `</div>`;
    const d = DATA.rankings.divisions[rkDiv];
    const open = /^open$/i.test(d.champ);
    h += `<div class="champ-row">
      <span class="belt-ic">${beltSVG('var(--gold)', 26)}</span>
      <div><div class="lbl">${open ? 'Vacant Throne' : 'Champion'}</div>
      <div class="nm">${open ? 'Open — no lineal champion' : esc(d.champ)}</div></div>
      ${d.limit ? `<span class="lim num">${esc(d.name)}<br>${esc(d.limit)}</span>` : ''}</div>
      <div class="rank-list">`;
    d.fighters.forEach((f, i) => {
      h += `<div class="rk">
        <span class="pos num">${i+1}</span>
        <div class="who"><div class="nm">${esc(f.name)}</div><div class="sub">${esc(f.cty)}</div></div>
        <div class="right"><span class="rec num">${esc(f.rec)}</span>${moveHTML(f)}</div></div>`;
    });
    h += `</div>`;
  }
  $('#v-rankings').innerHTML = h;
}
window.setRk = m => { rkMode = m; renderRankings(); };
window.setDiv = i => { rkDiv = i; renderRankings(); };

/* ---------- tabs ---------- */
let current = 'feed';
const scrollPos = {};
function setTab(t){
  if(t === 'more'){ toggleSheet(true); return; }
  scrollPos[current] = window.scrollY;
  current = t;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + t).classList.add('on');
  document.querySelectorAll('nav [data-tab]').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === t));
  $('#viewtitle').innerHTML = TITLES[t];
  window.scrollTo(0, scrollPos[t] || 0);
}
document.querySelectorAll('nav [data-tab]').forEach(b =>
  b.addEventListener('click', () => setTab(b.dataset.tab)));

/* ---------- more sheet ---------- */
function toggleSheet(on){
  $('#sheet').classList.toggle('on', on);
  $('#sheetbg').classList.toggle('on', on);
  document.querySelector('nav [data-tab="more"]').classList.toggle('on', on);
}
$('#sheetbg').addEventListener('click', () => toggleSheet(false));
addEventListener('keydown', e => { if(e.key === 'Escape') toggleSheet(false); });

renderFeed(); renderResults(); renderSchedule(); renderRankings();
setTab('feed');
</script>
